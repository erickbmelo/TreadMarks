name: Linux portable x64

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake libsfml-dev libglew-dev zlib1g-dev qtbase5-dev

      - name: Configure and build x64 binaries
        run: |
          test "$(uname -m)" = "x86_64"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/out"
          cmake --build build --parallel "$(nproc)"
          cmake --install build --prefix "$GITHUB_WORKSPACE/out"

      - name: Archive portable files
        run: tar -czf Tread-Marks-linux-x64-portable.tar.gz -C out .

      - name: Upload portable archive
        uses: actions/upload-artifact@v7
        with:
          path: Tread-Marks-linux-x64-portable.tar.gz
          archive: false
          if-no-files-found: error
